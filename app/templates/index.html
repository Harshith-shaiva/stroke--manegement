<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Stroke Risk Monitor — IBM Granite AI</title>
<style>
/* ── Reset & tokens ───────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;
  --surface:#111827;
  --surface2:#1a2235;
  --border:#1e2d45;
  --accent:#3b82f6;
  --accent2:#8b5cf6;
  --danger:#ef4444;
  --warn:#f59e0b;
  --ok:#10b981;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --light:#1e293b;
  --glow-blue:0 0 20px rgba(59,130,246,.35);
  --glow-purple:0 0 20px rgba(139,92,246,.35);
  --glow-red:0 0 25px rgba(239,68,68,.5);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow-x:hidden}

/* ── Animated background grid ────────────────────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

/* ── Header ──────────────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(10,14,26,.85);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;align-items:center;gap:14px;height:58px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glow-blue);font-size:18px;
}
.logo h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.logo h1 span{color:var(--accent)}
.header-tags{display:flex;gap:8px;margin-left:4px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid;font-weight:600;letter-spacing:.5px}
.tag-blue{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1)}
.tag-purple{border-color:var(--accent2);color:var(--accent2);background:rgba(139,92,246,.1)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.api-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.api-label{font-size:12px;color:var(--muted)}
#clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.wrapper{display:flex;min-height:calc(100vh - 58px);position:relative;z-index:1}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
nav{
  width:220px;flex-shrink:0;
  background:rgba(17,24,39,.7);
  backdrop-filter:blur(12px);
  border-right:1px solid var(--border);
  padding:16px 0;
  position:sticky;top:58px;
  height:calc(100vh - 58px);
  overflow-y:auto;
}
nav::-webkit-scrollbar{width:4px}
nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:14px 18px 6px;font-weight:600}
nav ul{list-style:none}
nav li a{
  display:flex;align-items:center;gap:10px;
  padding:9px 18px;color:var(--muted);font-size:13px;
  border-left:2px solid transparent;
  transition:all .15s;cursor:pointer;text-decoration:none;
}
nav li a:hover{background:var(--light);color:var(--text);border-left-color:var(--border)}
nav li a.active{background:rgba(59,130,246,.1);color:var(--accent);border-left-color:var(--accent)}
nav li a.active .nav-icon{filter:drop-shadow(0 0 4px var(--accent))}
nav li a.nav-emergency{color:#fca5a5}
nav li a.nav-emergency:hover,nav li a.nav-emergency.active{
  background:rgba(239,68,68,.12);color:var(--danger);
  border-left-color:var(--danger);
}
.nav-icon{font-size:15px;width:20px;text-align:center}
.nav-badge{
  margin-left:auto;font-size:9px;font-weight:700;
  background:var(--danger);color:#fff;
  border-radius:10px;padding:1px 6px;
  animation:pulse-badge 1.5s infinite;
}
@keyframes pulse-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ── Main ────────────────────────────────────────────────────────────────── */
main{flex:1;padding:28px;max-width:960px}

/* ── Page header ─────────────────────────────────────────────────────────── */
.page-header{margin-bottom:24px}
.page-header h2{font-size:22px;font-weight:700;margin-bottom:4px}
.page-header p{color:var(--muted);font-size:13px}
.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:8px}
.breadcrumb span{color:var(--accent)}

/* ── Stat cards ──────────────────────────────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:18px 20px;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--glow-blue)}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
.stat-card .icon{font-size:22px;margin-bottom:10px}
.stat-card .val{font-size:26px;font-weight:800;line-height:1}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.stat-card .trend{font-size:11px;margin-top:6px;font-weight:600}
.trend-up{color:var(--danger)}
.trend-ok{color:var(--ok)}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:24px;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.card-glow-blue::after{
  content:'';position:absolute;top:-40px;right:-40px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);
  pointer-events:none;
}
.card-glow-purple::after{
  content:'';position:absolute;top:-40px;right:-40px;
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.12),transparent 70%);
  pointer-events:none;
}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card p.sub{color:var(--muted);font-size:12px;margin-bottom:20px}

/* ── FAST cards ──────────────────────────────────────────────────────────── */
.fast-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.fast-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:16px;text-align:center;
  transition:all .3s;
}
.fast-card .fl{font-size:36px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.fast-card .fw{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fast-card .fd{font-size:10px;color:var(--muted);margin-top:2px}
.fast-card.flagged{
  background:rgba(239,68,68,.1);border-color:var(--danger);
  box-shadow:var(--glow-red);
}
.fast-card.flagged .fl{background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.fast-card.flagged .fw{color:#fca5a5}

/* ── Forms ───────────────────────────────────────────────────────────────── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:13px;
  font-family:inherit;width:100%;color:var(--text);
  transition:border .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
input::placeholder,textarea::placeholder{color:#475569}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:90px}
.span2{grid-column:span 2}
.span3{grid-column:span 3}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn-row{margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{
  border:none;border-radius:8px;padding:10px 22px;
  font-size:13px;font-weight:700;cursor:pointer;
  transition:all .2s;display:inline-flex;align-items:center;gap:7px;
  letter-spacing:.3px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 4px 15px rgba(59,130,246,.3);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.45)}
.btn-primary:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  color:#fff;box-shadow:0 4px 15px rgba(239,68,68,.4);
  font-size:14px;padding:12px 28px;
}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(239,68,68,.6)}
.btn-danger:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-neighbor{
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  color:#fff;box-shadow:0 4px 15px rgba(245,158,11,.4);
  font-size:14px;padding:12px 28px;
}
.btn-neighbor:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(245,158,11,.6)}

/* ── Spinner ─────────────────────────────────────────────────────────────── */
.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;
  animation:spin .6s linear infinite;display:none;
}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Result box ──────────────────────────────────────────────────────────── */
.result-box{margin-top:18px;border-radius:10px;overflow:hidden;display:none;border:1px solid var(--border)}
.result-box.show{display:block}
.result-header{
  padding:11px 16px;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.rh-ok{background:rgba(16,185,129,.15);color:#6ee7b7;border-bottom:1px solid rgba(16,185,129,.2)}
.rh-err{background:rgba(239,68,68,.15);color:#fca5a5;border-bottom:1px solid rgba(239,68,68,.2)}
.rh-emergency{
  background:rgba(239,68,68,.2);color:#fca5a5;
  border-bottom:1px solid var(--danger);
  animation:flash 1s infinite;
}
@keyframes flash{0%,100%{background:rgba(239,68,68,.2)}50%{background:rgba(239,68,68,.35)}}
.result-body{background:rgba(0,0,0,.3);padding:14px;font-size:12px;overflow-x:auto}
pre{white-space:pre-wrap;word-break:break-word;font-family:"Cascadia Code","Consolas",monospace;color:#e2e8f0}

/* ── Neighbor alert panel ────────────────────────────────────────────────── */
.neighbor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.nb-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:14px;
  transition:all .3s;
}
.nb-card.notified{
  border-color:var(--ok);background:rgba(16,185,129,.08);
  box-shadow:0 0 14px rgba(16,185,129,.2);
}
.nb-card .nb-name{font-weight:700;font-size:13px;margin-bottom:3px}
.nb-card .nb-phone{font-size:11px;color:var(--muted)}
.nb-card .nb-addr{font-size:11px;color:var(--muted);margin-top:2px}
.nb-card .nb-status{
  margin-top:8px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:4px;display:inline-block;
}
.nb-status-idle{background:rgba(148,163,184,.1);color:var(--muted)}
.nb-status-sent{background:rgba(16,185,129,.15);color:var(--ok)}

/* ── Emergency SOS button ────────────────────────────────────────────────── */
.sos-container{text-align:center;padding:28px 0 20px}
.sos-btn{
  width:160px;height:160px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 35% 35%, #ff6b6b, #b91c1c);
  box-shadow:0 0 0 0 rgba(239,68,68,.5);
  color:#fff;font-size:28px;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;margin:0 auto;
  animation:sos-idle 2.5s infinite;
  transition:transform .2s;
}
.sos-btn:hover{transform:scale(1.05);animation:sos-active 1s infinite}
.sos-btn:active{transform:scale(.96)}
.sos-btn .sos-label{font-size:11px;letter-spacing:2px;font-weight:700;opacity:.9}
@keyframes sos-idle{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4),0 0 30px rgba(239,68,68,.3)}
  50%{box-shadow:0 0 0 20px rgba(239,68,68,0),0 0 50px rgba(239,68,68,.5)}
}
@keyframes sos-active{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.8),0 0 40px rgba(239,68,68,.5)}
  50%{box-shadow:0 0 0 30px rgba(239,68,68,0),0 0 70px rgba(239,68,68,.8)}
}

/* ── Progress / risk bar ─────────────────────────────────────────────────── */
.risk-bar-wrap{margin:14px 0}
.risk-bar-track{background:var(--surface2);border-radius:8px;height:10px;overflow:hidden;border:1px solid var(--border)}
.risk-bar-fill{height:100%;border-radius:8px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.risk-score-row{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--muted)}

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{
  padding:9px 18px;background:none;border:none;cursor:pointer;
  font-size:13px;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .15s;font-family:inherit;font-weight:600;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Toast notification ──────────────────────────────────────────────────── */
#toast-container{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;
  font-size:13px;min-width:280px;max-width:380px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  display:flex;align-items:flex-start;gap:10px;
  animation:toast-in .3s ease;
}
.toast.removing{animation:toast-out .3s ease forwards}
@keyframes toast-in{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toast-out{to{transform:translateX(110%);opacity:0}}
.toast-emergency{border-color:var(--danger);background:rgba(239,68,68,.12)}
.toast-ok{border-color:var(--ok);background:rgba(16,185,129,.1)}
.toast-warn{border-color:var(--warn);background:rgba(245,158,11,.1)}
.toast-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.toast-body .toast-title{font-weight:700;font-size:13px;margin-bottom:2px}
.toast-body .toast-msg{font-size:12px;color:var(--muted)}
.toast-close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;background:none;border:none;color:var(--muted)}

/* ── Activity feed ───────────────────────────────────────────────────────── */
.feed{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.feed::-webkit-scrollbar{width:4px}
.feed::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.feed-item{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;font-size:12px;
}
.feed-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.feed-time{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:768px){
  nav{display:none}
  .stat-row{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .span2,.span3{grid-column:span 1}
  .fast-row{grid-template-columns:1fr 1fr}
  .neighbor-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">🧠</div>
    <h1>Stroke Risk <span>Monitor</span></h1>
  </div>
  <div class="header-tags">
    <span class="tag tag-blue">IBM GRANITE</span>
    <span class="tag tag-purple">watsonx.ai</span>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="api-dot" id="api-dot"></span>
      <span class="api-label" id="api-label">Checking…</span>
    </div>
    <span id="clock"></span>
  </div>
</header>

<div class="wrapper">

  <!-- Sidebar -->
  <nav>
    <div class="nav-section">Overview</div>
    <ul>
      <li><a data-page="dashboard" class="active"><span class="nav-icon">📊</span>Dashboard</a></li>
    </ul>
    <div class="nav-section">AI Agents</div>
    <ul>
      <li><a data-page="stroke"><span class="nav-icon">🔬</span>Stroke Risk</a></li>
      <li><a data-page="bp"><span class="nav-icon">❤️</span>Blood Pressure</a></li>
      <li><a data-page="trends"><span class="nav-icon">📈</span>Health Trends</a></li>
      <li><a data-page="lifestyle"><span class="nav-icon">🌿</span>Lifestyle Advisory</a></li>
      <li><a data-page="emergency" class="nav-emergency"><span class="nav-icon">🚨</span>Emergency Alert<span class="nav-badge">SOS</span></a></li>
    </ul>
    <div class="nav-section">Tools</div>
    <ul>
      <li><a data-page="report"><span class="nav-icon">📄</span>Hospital Report</a></li>
    </ul>
  </nav>

  <!-- Main -->
  <main id="main-content"></main>
</div>

<script>
const API = '/api/v1';
let _activityFeed = [];
let _neighborStates = {};

/* ═══ Utilities ════════════════════════════════════════════════════════════ */
function fmt(d){ return new Date(d).toLocaleTimeString(); }

function toast(type, title, msg, duration=5000){
  const icons = {emergency:'🚨', ok:'✅', warn:'⚠️', info:'ℹ️'};
  const cls = {emergency:'toast-emergency', ok:'toast-ok', warn:'toast-warn', info:''};
  const t = document.createElement('div');
  t.className = `toast ${cls[type]||''}`;
  t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span>
    <div class="toast-body"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>
    <button class="toast-close" onclick="this.closest('.toast').remove()">✕</button>`;
  document.getElementById('toast-container').prepend(t);
  if(duration) setTimeout(()=>{ t.classList.add('removing'); setTimeout(()=>t.remove(), 300); }, duration);
}

function addFeed(color, text){
  _activityFeed.unshift({color, text, time: new Date().toLocaleTimeString()});
  if(_activityFeed.length > 20) _activityFeed.pop();
  renderFeed();
}

function renderFeed(){
  const el = document.getElementById('activity-feed');
  if(!el) return;
  el.innerHTML = _activityFeed.map(f=>`
    <div class="feed-item">
      <span class="feed-dot" style="background:${f.color}"></span>
      <span>${f.text}</span>
      <span class="feed-time">${f.time}</span>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12px;padding:8px">No activity yet.</div>';
}

async function callAPI(endpoint, payload, btnId, spinId, resultId, onSuccess){
  const btn = document.getElementById(btnId);
  const spin = document.getElementById(spinId);
  if(btn) btn.disabled = true;
  if(spin) spin.classList.add('show');
  try{
    const r = await fetch(`${API}/${endpoint}`,{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const json = await r.json();
    showResult(resultId, json.success, json);
    if(onSuccess) onSuccess(json);
    return json;
  } catch(e){
    showResult(resultId, false, {error:e.message});
    toast('warn','Request Failed', e.message);
  } finally{
    if(btn) btn.disabled=false;
    if(spin) spin.classList.remove('show');
  }
}

function showResult(id, ok, data){
  const box = document.getElementById(id);
  if(!box) return;

function addBPRow(){

  const row=document.createElement('div');
  row.className='grid3'; row.style.marginBottom='10px';

async function runBP(){
  const current={
    systolic:+document.getElementById('bp-sys').value,
    diastolic:+document.getElementById('bp-dia').value,
    timestamp:new Date(document.getElementById('bp-ts').value).toISOString()
  };
  const history=[];
  document.querySelectorAll('.bph-sys').forEach((_,i)=>{
    const s=document.querySelectorAll('.bph-sys')[i];
    const d=document.querySelectorAll('.bph-dia')[i];
    const t=document.querySelectorAll('.bph-ts')[i];
    if(s.value&&d.value&&t.value)
      history.push({systolic:+s.value,diastolic:+d.value,timestamp:new Date(t.value).toISOString()});
  });
  addFeed('var(--accent)','BP analysis started');
  await callAPI('monitor/blood-pressure',{current,history},'bp-btn','bp-spin','bp-result', json=>{
    if(json.success&&json.data?.requires_immediate_attention){
      toast('emergency','⚠️ Hypertensive Crisis','BP requires IMMEDIATE medical attention!', 0);
      addFeed('var(--danger)','HYPERTENSIVE CRISIS detected!');
    } else if(json.success){
      addFeed('var(--ok)',`BP classified: ${json.data?.classification}`);
      toast('ok','BP Analysis Complete',json.data?.classification);
    }
  });
}

async function loadNeighbors(){
  try{
    const r = await fetch(`${API}/alert/neighbors`);
    const j = await r.json();
    renderNeighbors(j.neighbors||[]);
  } catch{ }
}

function renderNeighbors(neighbors){
  const grid = document.getElementById('neighbor-grid');
  if(!grid) return;
  grid.innerHTML = neighbors.map(nb=>{
    const sent = !!nb.notified_at;
    return `<div class="nb-card ${sent?'notified':''}" id="nb-${nb.id}">
      <div class="nb-name">👤 ${nb.name}</div>
      <div class="nb-phone">📱 ${nb.phone}</div>
      <div class="nb-addr">📍 ${nb.address}</div>
      <span class="nb-status ${sent?'nb-status-sent':'nb-status-idle'}">
        ${sent ? '✅ Notified ' + new Date(nb.notified_at).toLocaleTimeString() : '⏳ Standby'}
      </span>
    </div>`;
  }).join('');
}

async function alertNeighbors(patientName='Patient', urgency='EMERGENCY'){
  const btn = document.getElementById('nb-btn');
  const spin = document.getElementById('nb-spin');
  if(btn) btn.disabled=true;
  if(spin) spin.classList.add('show');
  try{
    const r = await fetch(`${API}/alert/neighbors`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({patient_name:patientName, urgency, message:'Stroke emergency — please check on your neighbor immediately!'})
    });
    const j = await r.json();
    showResult('nb-result', j.success, j);
    if(j.success){
      renderNeighbors(j.neighbors_notified||[]);
      toast('emergency',`🚨 ${j.total_notified} Neighbors Notified!`,'Emergency alert broadcast complete', 0);
      addFeed('var(--danger)',`Emergency alert sent to ${j.total_notified} neighbors`);
    }
  } catch(e){ toast('warn','Alert Failed',e.message); }
  finally{ if(btn) btn.disabled=false; if(spin) spin.classList.remove('show'); }
}

async function triggerSOS(){
  const btn = document.getElementById('sos-btn');
  btn.style.transform='scale(.9)';
  setTimeout(()=>btn.style.transform='',200);
  toast('emergency','🚨 SOS TRIGGERED','Broadcasting to all neighbors NOW!', 0);
  addFeed('var(--danger)','🚨 SOS button pressed — broadcasting emergency!');
  await alertNeighbors('SOS Patient','EMERGENCY');
}

async function runEmergency(){
  const symptoms_text = document.getElementById('e-symptoms').value.trim();
  if(!symptoms_text){ toast('warn','Missing Symptoms','Please describe the symptoms first.'); return; }
  addFeed('var(--danger)','Emergency symptom assessment started');
  await callAPI('alert/emergency',{symptoms_text},'e-btn','e-spin','e-result', json=>{
    if(json.success&&json.data){
      const d = json.data;
      ['face','arm','speech'].forEach(k=>{
        const c=document.getElementById('fc-'+k);
        if(c) c.classList.toggle('flagged', !!d.fast_flags?.[k]);
      });
      if(d.urgency==='EMERGENCY'){
        toast('emergency','🚨 STROKE EMERGENCY DETECTED','Alerting neighbors automatically…', 0);
        addFeed('var(--danger)','STROKE EMERGENCY — auto-alerting neighbors');
        setTimeout(()=>alertNeighbors('Stroke Patient', 'EMERGENCY'), 800);
      } else {
        addFeed('var(--warn)',`Urgency: ${d.urgency}`);
        toast('warn','Assessment Complete',`Urgency: ${d.urgency}`);
      }
    }
  });
}

/* ── Report ──────────────────────────────────────────────────────────── */
function pageReport(){
  return `
<div class="page-header">
  <div class="breadcrumb">Tools / <span>Hospital Report Summary</span></div>
  <h2>📄 Hospital Report Summary</h2>
  <p>Extract stroke-relevant information from hospital discharge reports (first 3 000 chars)</p>
</div>
<div class="card card-glow-blue">
  <h3>Report Upload</h3>
  <p class="sub">Paste the hospital report text below</p>
  <div class="grid2">
    <div class="field span2"><label>Hospital Name *</label><input id="r-hosp" placeholder="e.g. City General Hospital"></div>
    <div class="field span2"><label>Report Text *</label>
      <textarea id="r-text" style="min-height:180px" placeholder="Paste the full hospital report text here…"></textarea></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="r-btn" onclick="runReport()">
      <span>📄</span> Extract & Summarise <div class="spinner" id="r-spin"></div>
    </button>
    <button class="btn btn-secondary" onclick="fillSampleReport()">Load Sample</button>
  </div>
  <div class="result-box" id="r-result"></div>
</div>`;
}

function fillSampleReport(){
  document.getElementById('r-hosp').value='City General Hospital';
  document.getElementById('r-text').value='Patient admitted 2024-11-10. Diagnosed with hypertension (BP 165/105). History of TIA. Prescribed amlodipine 5mg. Fasting glucose 142 mg/dL. Total cholesterol 230 mg/dL. Advised lifestyle changes and follow-up in 4 weeks.';
}

async function runReport(){
  const payload={
    hospital_name:document.getElementById('r-hosp').value.trim(),
    report_text:document.getElementById('r-text').value.trim()
  };
  addFeed('var(--accent)','Hospital report summarisation started');
  await callAPI('report/summarise',payload,'r-btn','r-spin','r-result', json=>{
    if(json.success){
      addFeed('var(--ok)',`Report from ${payload.hospital_name} summarised`);
      toast('ok','Report Summarised',`${json.data?.key_diagnoses?.length||0} diagnoses extracted`);
    }
  });
}

/* ═══ Navigation ═══════════════════════════════════════════════════════════ */
const pageBuilders = {
  dashboard: pageDashboard,
  stroke: pageStroke,
  bp: pageBP,
  trends: pageTrends,
  lifestyle: pageLifestyle,
  emergency: pageEmergency,
  report: pageReport,
};

function showPage(name){
  const builder = pageBuilders[name];
  if(!builder) return;
  document.getElementById('main-content').innerHTML = builder();
  document.querySelectorAll('nav li a').forEach(a=>
    a.classList.toggle('active', a.dataset.page===name));
  if(name==='bp'){ document.getElementById('bp-ts').value=new Date().toISOString().slice(0,16); addBPRow(); addBPRow(); }
  if(name==='emergency') loadNeighbors();
  renderFeed();
}

document.querySelectorAll('nav li a').forEach(a=>{
  a.addEventListener('click', e=>{ e.preventDefault(); showPage(a.dataset.page); });
});

/* ── Boot ── */
showPage('dashboard');
</script>
